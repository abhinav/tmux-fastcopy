name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod
        cache: true

    - name: Install parse-changelog
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
      with:
        tool: parse-changelog@0.5.1

    - name: Prepare release
      run: |
        set -eou pipefail
        VERSION=${{ github.ref }}
        VERSION="${VERSION#refs/tags/}"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "Releasing $VERSION"
        echo "Release notes:"
        echo "----"
        {
          parse-changelog CHANGELOG.md "${VERSION#v}"
          echo ""
          echo "---"
          echo ""
          echo "[Support this project](https://github.com/sponsors/abhinav)"
        } | tee "changes.$VERSION.txt"
        echo "----"

    - name: Release
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
      with:
        distribution: goreleaser
        version: latest
        args: release --clean --release-notes changes.${{ env.VERSION }}.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        AUR_KEY: ${{ secrets.AUR_KEY }}
        HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        GORELEASER_CURRENT_TAG: ${{ env.VERSION }}
