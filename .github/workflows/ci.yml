name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      name: Check out repository
    - name: Set up mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        cache_key_prefix: mise-v0-stable
    - run: mise run lint

  test:
    runs-on: ubuntu-latest
    name: Unit Test

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      name: Check out repository
    - name: Set up mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        cache_key_prefix: mise-v0-stable
    - name: Build tmux-fastcopy
      run: mise run build
    - name: Test
      run: mise run cover:unit
    - name: Coverage
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
      with:
        files: ./cover.out

  integration:
    runs-on: ubuntu-latest
    name: Integration Test / Tmux ${{ matrix.tmux-version }}
    strategy:
      matrix:
        tmux-version:
          - "3.6a"
          - "3.5a"
          - "3.4"
          - "3.3a"
          - "3.2a"
          - "3.1c"
          - "3.0a"
          - "2.9a"
          - "2.8"
          - "2.7"

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      name: Check out repository
    - name: Set up mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        cache_key_prefix: mise-v0-stable

    - name: Checkout Tmux
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: tmux/tmux
        ref: ${{ matrix.tmux-version }}
        path: src/tmux
    - name: Load cached Tmux
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.local
        key: ${{ runner.os }}-tmux-${{ matrix.tmux-version }}

    - name: Download and install dependencies
      run: |
        sudo apt-get install -y libevent-dev libncurses-dev
    - name: Install Tmux
      working-directory: src/tmux
      run: |
        if [[ ! -x "$HOME/.local/bin/tmux" ]]; then
          sh autogen.sh
          ./configure --prefix="$HOME/.local"
          make install
        else
          echo "Using cached tmux"
        fi

    - name: Build tmux-fastcopy
      run: mise run build

    - name: Integration test
      run: mise run cover:integration

    - name: Upload coverage
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
      with:
        files: ./cover.integration.out
